    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8a634' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 4h2.5l2.2 11.5h11.6L21 7H5.1'/%3E%3Ccircle cx='9' cy='19.5' r='1.3'/%3E%3Ccircle cx='16.5' cy='19.5' r='1.3'/%3E%3Cpath fill='%23e8a634' stroke='none' d='M13 14c-2.1-1.3-3.2-2.5-3.2-3.7a1.6 1.6 0 0 1 3.2-.45 1.6 1.6 0 0 1 3.2.45c0 1.2-1.1 2.4-3.2 3.7Z'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("khmershop-theme");
          var mode = saved === "light" || saved === "dark" ? saved : "system";
          theme = mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
